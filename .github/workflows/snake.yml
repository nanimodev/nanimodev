name: generate-snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/snake.svg
            assets/snake-dark.svg?palette=github-dark
      - run: |
          git config user.name "nanimodev"
          git config user.email "aeris.cpp@gmail.com"
          git add assets/snake.svg assets/snake-dark.svg
          git diff --staged --quiet || (git commit -m "chore: update snake" && git push)

